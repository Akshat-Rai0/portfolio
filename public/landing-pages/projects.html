<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Projects | Akshat Rai</title>
<meta name="description" content="Akshat Rai's projects: agentic systems, computer vision, RAG, and production ML.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 22 24'%3E%3Crect width='22' height='24' fill='%234a4d44'/%3E%3Cpath fill='%23fff' d='M11 1.3c-2.1 0-3.95 1.2-4.75 2.95C3.95 4.55 2.3 6.25 2.3 8.35c0 2.3 1.9 4.2 4.3 4.2h8.8c2.4 0 4.3-1.9 4.3-4.2 0-2.1-1.65-3.8-4-4.1C14.95 2.5 13.1 1.3 11 1.3Z'/%3E%3Cpath fill='%23fff' d='M9.6 12.55h2.8v4.2c1.35.3 2.45 1.15 3.15 2.4-1.35.4-2.4.15-3.15-.4v4.15H9.6v-4.15c-.75.55-1.8.8-3.15.4.7-1.25 1.8-2.1 3.15-2.4v-4.2Z'/%3E%3C/svg%3E">
<style>
  @font-face{
    font-family:'Lexend';
    src:url('inner-green-assets/lexend-latin.woff2') format('woff2');
    font-weight:100 900; font-style:normal; font-display:swap;
    unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD;
  }

  :root{
    --ink: #ffffff;
    --ink-soft: rgba(255,255,255,.62);
    --ink-faint: rgba(255,255,255,.44);
    --card: #f2f3ef;
    --card-ink: #23261f;
    --card-label: #7c8177;
  }

  *,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }

  html{ background:#383b34; }
  body{
    font-family:'Lexend',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    font-weight:300;
    color:var(--ink);
    background:#383b34;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
    -moz-osx-font-smoothing:grayscale;
  }

  .container{
    max-width:1200px;
    margin:0 auto;
    padding:calc(40px) calc(20px);
  }

  .header{
    margin-bottom:calc(60px);
  }

  .back-link{
    display:inline-flex;
    align-items:center;
    gap:calc(8px);
    color:var(--ink-soft);
    text-decoration:none;
    font-size:calc(14px);
    font-weight:400;
    transition:color .2s ease;
  }
  .back-link:hover{ color:var(--ink); }
  .back-link svg{ width:calc(16px); height:calc(16px); }

  h1{
    font-size:clamp(32px,5vw,48px);
    font-weight:300;
    letter-spacing:-0.5px;
    margin-top:calc(20px);
    line-height:1.1;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(320px,1fr));
    gap:calc(24px);
  }

  .card{
    background:var(--card);
    border-radius:calc(16px);
    padding:calc(24px);
    box-shadow:0 calc(12px) calc(32px) rgba(16,21,13,.20);
    transition:box-shadow .3s ease,transform .3s ease;
    text-decoration:none;
    display:block;
  }
  .card:hover{
    box-shadow:0 calc(16px) calc(40px) rgba(16,21,13,.28);
    transform:translateY(-2px);
  }

  .card-header{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    margin-bottom:calc(16px);
  }

  .status{
    font-size:calc(11px);
    font-weight:500;
    padding:calc(4px) calc(10px);
    border-radius:calc(6px);
    text-transform:uppercase;
    letter-spacing:0.5px;
  }
  .status--shipped{
    background:rgba(28,34,22,0.12);
    color:var(--card-ink);
  }
  .status--in-progress{
    background:rgba(124,129,119,0.3);
    color:var(--card-ink);
  }

  .card h2{
    font-size:calc(18px);
    font-weight:400;
    color:var(--card-ink);
    margin-bottom:calc(8px);
    line-height:1.3;
  }

  .card p{
    font-size:calc(14px);
    line-height:1.5;
    color:var(--card-label);
    margin-bottom:calc(16px);
  }

  .tags{
    display:flex;
    flex-wrap:wrap;
    gap:calc(6px);
  }

  .tag{
    font-size:calc(11px);
    font-weight:500;
    padding:calc(4px) calc(10px);
    border-radius:calc(6px);
    background:rgba(28,34,22,0.08);
    color:var(--card-ink);
  }

  @media (max-width:768px){
    .container{ padding:calc(24px) calc(16px); }
    .grid{ grid-template-columns:1fr; }
    h1{ font-size:calc(32px); }
  }
</style>
</head>
<body>
<div class="container">
  <header class="header">
    <a href="/landing-pages/inner-green-3d.html" class="back-link">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 12H5M12 19l-7-7 7-7"/>
      </svg>
      Back
    </a>
    <h1>Projects</h1>
  </header>

  <div class="grid" id="projects-grid">
    <!-- Projects will be injected here -->
  </div>
</div>

<script>
const PROJECTS = [
  {
    name: "EYE",
    oneLiner: "Visual asset manager: YOLOv11, Moondream2 and CLIP tagging with a 3D UMAP embedding graph; 400 images at 1.8 s/image on CPU",
    repoUrl: "https://github.com/Akshat-Rai0/eye-project",
    status: "shipped",
    tags: ["Computer Vision", "Multimodal"],
    visible: true
  },
  {
    name: "NTPC-NVVN-MP",
    oneLiner: "Electricity demand forecasting with Django and LightGBM, built as production ML",
    repoUrl: "https://github.com/Akshat-Rai0/NTPC-NVVN-MP",
    status: "shipped",
    tags: ["Forecasting", "Production ML"],
    visible: true
  },
  {
    name: "PLAN-EXECUTE-AGENT",
    oneLiner: "LangGraph harness for plan-and-execute agent architectures, with browser automation",
    repoUrl: "https://github.com/Akshat-Rai0/PLAN-EXECUTE-AGENT",
    status: "in-progress",
    tags: ["Agents", "LangGraph"],
    visible: true
  },
  {
    name: "DocuMentor",
    oneLiner: "Hybrid RAG retrieval system",
    repoUrl: "https://github.com/Akshat-Rai0/DOCUMENTOR",
    status: "in-progress",
    tags: ["RAG", "Retrieval"],
    visible: true
  },
  {
    name: "ALPR",
    oneLiner: "License plate recognition with classical CV: plate detection, character segmentation, SVM OCR, retraining pipeline",
    repoUrl: "https://github.com/Akshat-Rai0/license_plate_recognition",
    status: "in-progress",
    tags: ["Computer Vision", "Classical CV"],
    visible: true
  },
  {
    name: "Shazam Clone",
    oneLiner: "Song identification via spectrogram peak-hashing audio fingerprinting",
    repoUrl: "https://github.com/Akshat-Rai0/shazam-clone",
    status: "in-progress",
    tags: ["Audio", "Signal Processing"],
    visible: true
  },
  {
    name: "treeMem",
    oneLiner: "Hierarchical tree memory for LLM agents: concise parents, detailed children",
    repoUrl: "https://github.com/Akshat-Rai0/treeMem",
    status: "in-progress",
    tags: ["Agents", "Memory"],
    visible: true
  },
  {
    name: "EBOOK2AUDIOBOOK",
    oneLiner: "Agentic ebook-to-audiobook system",
    repoUrl: "https://github.com/Akshat-Rai0/EBOOK2AUDIOBOOK",
    status: "in-progress",
    tags: ["Agents", "Audio"],
    visible: true
  }
];

const grid = document.getElementById('projects-grid');

const visibleProjects = PROJECTS.filter(p => p.visible !== false);
const sortedProjects = visibleProjects.sort((a, b) => {
  if (a.status === 'shipped' && b.status !== 'shipped') return -1;
  if (a.status !== 'shipped' && b.status === 'shipped') return 1;
  return 0;
});

sortedProjects.forEach(project => {
  const card = document.createElement('a');
  card.className = 'card';
  card.href = project.repoUrl;
  card.target = '_blank';
  card.rel = 'noopener noreferrer';

  const statusLabel = project.status === 'shipped' ? 'Shipped' : 'In progress';
  const statusClass = project.status === 'shipped' ? 'status--shipped' : 'status--in-progress';

  card.innerHTML = `
    <div class="card-header">
      <span class="status ${statusClass}">${statusLabel}</span>
    </div>
    <h2>${project.name}</h2>
    <p>${project.oneLiner}</p>
    <div class="tags">
      ${project.tags.map(tag => `<span class="tag">${tag}</span>`).join('')}
    </div>
  `;

  grid.appendChild(card);
});
</script>
</body>
</html>
